services:
  nginx:
    image: nginx
    build: ./requirements/nginx
    restart: on-failure
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - "wordpress_data:/var/www/html"
    depends_on:
      - wordpress
      - mariadb

  mariadb:
    image: mariadb
    build: ./requirements/mariadb
    restart: on-failure
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception
    volumes:
      - "mariadb_data:/var/lib/mysql"
  
  wordpress:
    image: wordpress
    build: ./requirements/wordpress
    restart: on-failure
    env_file: .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    networks:
      - inception
    volumes:
      - "wordpress_data:/var/www/html"
    depends_on:
      - mariadb

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/adzahrao/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/adzahrao/data/wordpress

secrets:
  db_password:
    file: ../secrets/ps_database.txt
  db_root_password:
    file: ../secrets/pw_root_db.txt
  wp_admin_password:
    file: ../secrets/pw_admin.txt
  wp_user_password:
    file: ../secrets/pw_user.txt